name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  process:
    name: Process
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Managed files are unchanged
        run: bash scripts/process/check-kit.sh

      - name: Script syntax
        run: |
          failed=0
          for script in $(git ls-files 'scripts/*.sh' .githooks); do
            bash -n "$script" || { echo "::error file=$script::bash -n failed"; failed=1; }
          done
          exit "$failed"

      - name: Script tests
        run: |
          failed=0
          for test in $(git ls-files 'scripts/*.sh' | grep -E '(^|/)test-[^/]*\.sh$'); do
            echo "== $test"
            bash "$test" || { echo "::error file=$test::$test failed"; failed=1; }
          done
          exit "$failed"

      - name: SchulplanerKit imports no UI or storage framework
        run: bash scripts/check-kit-imports.sh

      - name: No personal signing settings
        run: bash scripts/check-signing.sh

  # Add the project's own jobs here, and list each one in ci-passed.needs.

  ios:
    name: iOS
    # The image with Xcode 27, a preview on GitHub's side (actions/runner-images#14404).
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      # The pinned Xcode (ADR-0002): the newest release on the runner. README's
      # "Development setup" names the same version.
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7

      - name: Xcode
        run: xcodebuild -version

      # Resolving writes the Package.resolved files the next step reads, also
      # when they were not committed.
      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies -project Schulplaner.xcodeproj -scheme Schulplaner
          swift package resolve --package-path SchulplanerKit

      - name: Every package is allowed by an ADR
        run: bash scripts/check-packages.sh

      - name: Build and test
        run: bash scripts/build-and-test.sh

  # The one check the main ruleset requires. Every other job is listed in
  # `needs`, so adding a job never means touching the repository settings.
  ci-passed:
    name: CI passed
    # Without always(), a failed job would skip this one, and a skipped
    # required check counts as passed.
    if: always()
    needs: [process, ios]
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "Not every job succeeded: ${{ join(needs.*.result, ', ') }}"
          exit 1
      - run: echo "every job succeeded"
